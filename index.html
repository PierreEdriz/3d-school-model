<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Security 3D Model</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- UI Layer -->
    <div id="ui-container">
      
      <!-- Top Toolbar -->
      <div id="top-toolbar">
        <div class="brand-block">
          <div class="brand">SCHOOL SECURITY <span class="brand-muted">3D MODEL</span></div>
        </div>
        <div class="toolbar-center">
          <div class="modes" role="group" aria-label="Workspace mode">
            <button id="btn-edit-mode" class="active"><span class="mode-dot"></span>EDIT MODE</button>
            <button id="btn-view-mode"><span class="mode-dot"></span>VIEW MODE</button>
          </div>
        </div>
      </div>

      <div class="main-content">
        <!-- Left Sidebar: Component Library -->
        <div id="left-sidebar" class="sidebar sidebar-left">
          <div class="sidebar-header">
            <div>
              <div class="sidebar-kicker">SCENE CONTROLS</div>
              <h3>COMPONENTS</h3>
            </div>
          </div>

          <div class="sidebar-toolbar">
            <label class="search-field" for="control-search">
              <span class="search-icon" aria-hidden="true">&#9906;</span>
              <input id="control-search" type="search" placeholder="Search controls" autocomplete="off">
            </label>
            <button id="btn-clear-control-search" class="clear-search" type="button" title="Clear search" aria-label="Clear search">&times;</button>
          </div>

          <div id="control-no-results" class="control-no-results" hidden>No controls found</div>

          <div class="library-categories">
            <section class="control-section is-open" data-section="room">
              <button class="section-toggle" type="button" aria-expanded="true">
                <span class="section-title">Room Controls</span>
              </button>
              <div class="section-content">
                <div class="control-card">
                  <input type="checkbox" id="chk-toggle-roof" checked>
                  <label for="chk-toggle-roof"><span>Show Roof &amp; Ceiling</span><small>Structure visibility</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-toggle-chairs">
                  <label for="chk-toggle-chairs"><span>Show Chairs</span><small>Interior furniture</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-toggle-blackboards" checked>
                  <label for="chk-toggle-blackboards"><span>Show Blackboards</span><small>Classroom details</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-toggle-doors" checked>
                  <label for="chk-toggle-doors"><span>Show Doors</span><small>Entry points</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-toggle-windows" checked>
                  <label for="chk-toggle-windows"><span>Show Windows</span><small>Openings and glazing</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-toggle-cctv" checked>
                  <label for="chk-toggle-cctv"><span>Show CCTV</span><small>Security cameras</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-toggle-rollup-shutters">
                  <label for="chk-toggle-rollup-shutters"><span>Roll-Up Shutters Down</span><small>Security closure</small></label>
                </div>
              </div>
            </section>

            <section class="control-section is-open" data-section="buildings">
              <button class="section-toggle" type="button" aria-expanded="true">
                <span class="section-title">Building Visibility</span>
              </button>
              <div class="section-content">
                <div class="control-card">
                  <input type="checkbox" id="chk-building-left" checked>
                  <label for="chk-building-left"><span>Building Left</span><small>West classroom wing</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-building-right" checked>
                  <label for="chk-building-right"><span>Building Right</span><small>East classroom wing</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-building-back-left" checked>
                  <label for="chk-building-back-left"><span>Building Back Left</span><small>Rear classroom wing</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-building-back-right" checked>
                  <label for="chk-building-back-right"><span>Building Back Right</span><small>Rear classroom wing</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-covered-court" checked>
                  <label for="chk-covered-court"><span>Covered Court</span><small>Gym and stage</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-campus-fence" checked>
                  <label for="chk-campus-fence"><span>Campus Fence</span><small>Perimeter boundary</small></label>
                </div>
                <div class="control-card">
                  <input type="checkbox" id="chk-security-checkpoints" checked>
                  <label for="chk-security-checkpoints"><span>Gate Security Checkpoints</span><small>Entrance security</small></label>
                </div>
              </div>
            </section>
          </div>

          <div class="sidebar-footer"><span class="status-dot"></span><span>Changes apply instantly</span></div>
        </div>

        <!-- 3D Canvas Container -->
        <div id="canvas-container"></div>

        <!-- Right Sidebar: Properties -->
        <div id="right-sidebar" class="sidebar">
          <h3>PROPERTIES</h3>
          <div id="no-selection">No object selected</div>
          <div id="properties-panel" style="display: none;">
            <div class="prop-group">
              <label>Name: <span id="prop-name"></span></label>
            </div>
            <div class="prop-group">
              <label>Position</label>
              X: <input type="number" id="prop-pos-x" step="0.1">
              Y: <input type="number" id="prop-pos-y" step="0.1">
              Z: <input type="number" id="prop-pos-z" step="0.1">
            </div>
            <div class="prop-group">
              <label>Rotation (deg)</label>
              X: <input type="number" id="prop-rot-x" step="15">
              Y: <input type="number" id="prop-rot-y" step="15">
              Z: <input type="number" id="prop-rot-z" step="15">
            </div>
            <div class="prop-actions">
              <button id="btn-delete">Delete (Del)</button>
              <button id="btn-duplicate">Duplicate (Ctrl+D)</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
